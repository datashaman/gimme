[project]
name = "gimme-mcp"
version = "0.5.0"
description = "An MCP deployment control plane for provisioning and deploying PHP applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0,<4.0",
    "pydantic>=2.10,<3.0",
]

[project.scripts]
gimme-mcp = "gimme.server:main"
gimme-bootstrap-target = "gimme.cli:bootstrap_target"
gimme-bootstrap-database = "gimme.cli:bootstrap_database"

[dependency-groups]
dev = [
    "bandit>=1.9,<2.0",
    "pip-audit>=2.10,<3.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.13,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gimme"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
