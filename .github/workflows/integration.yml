name: Disposable VM integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      GIMME_INTEGRATION_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Configure isolated state directory
        run: echo "GIMME_STATE_DIR=$RUNNER_TEMP/gimme-state" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: uv sync --frozen
      - run: composer install --no-interaction --prefer-dist
      - name: Install locked real-Laravel Valkey fixture
        run: composer install --working-dir=tests/integration/laravel-valkey --no-interaction --prefer-dist
      - name: Configure loopback SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo systemctl enable --now ssh
          printf '127.0.0.1 gimme-ci.local gimme-ci-replacement.local\n' \
            | sudo tee -a /etc/hosts >/dev/null
          install -d -m 0700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/gimme-ci"
          install -m 0600 "$HOME/.ssh/gimme-ci.pub" "$RUNNER_TEMP/gimme-ci.pub"
          cat "$RUNNER_TEMP/gimme-ci.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 0600 "$HOME/.ssh/authorized_keys"
          ssh-keyscan -H 127.0.0.1 >> "$HOME/.ssh/known_hosts"
          {
            echo 'Host 127.0.0.1 gimme-ci.local gimme-ci-replacement.local'
            echo '  HostName 127.0.0.1'
            echo "  User $USER"
            echo "  IdentityFile $HOME/.ssh/gimme-ci"
            echo '  IdentitiesOnly yes'
            echo '  HostKeyAlias 127.0.0.1'
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"
          ssh -o BatchMode=yes 127.0.0.1 true
      - name: Write disposable desired state
        run: uv run python tests/integration/disposable_vm_smoke.py setup
      - name: Bootstrap stack and database administration
        run: |
          uv run gimme-bootstrap-target integration
          uv run gimme-bootstrap-database integration
      - name: Pin observed resource versions
        run: uv run python tests/integration/disposable_vm_smoke.py pin-resources
      - name: Exercise isolated resources and host services
        run: uv run python tests/integration/disposable_vm_smoke.py verify
      - name: Exercise the real Laravel and Horizon Valkey contract
        run: uv run python tests/integration/laravel_valkey_smoke.py
      - name: Start a TLS-verified MinIO Backup Destination
        run: |
          install -d -m 0700 "$RUNNER_TEMP/minio-certs" "$RUNNER_TEMP/minio-data"
          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/minio-certs/private.key" \
            -out "$RUNNER_TEMP/minio-certs/public.crt" -days 1 -nodes \
            -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
          docker run -d --name gimme-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=gimme-ci -e MINIO_ROOT_PASSWORD=gimme-ci-secret \
            -e MINIO_KMS_SECRET_KEY="gimme-ci-key:$(openssl rand -base64 32)" \
            -v "$RUNNER_TEMP/minio-certs:/root/.minio/certs" \
            -v "$RUNNER_TEMP/minio-data:/data" \
            quay.io/minio/minio server /data --certs-dir /root/.minio/certs
          for _ in $(seq 1 30); do
            curl -sk --max-time 2 https://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          echo "AWS_CA_BUNDLE=$RUNNER_TEMP/minio-certs/public.crt" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=gimme-ci" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=gimme-ci-secret" >> "$GITHUB_ENV"
      - name: Exercise Recovery Point capture and full or partial Restore
        run: uv run python tests/integration/disposable_vm_smoke.py verify-backup-destination
      - name: Stop disposable services
        if: always()
        run: |
          uv run python tests/integration/laravel_valkey_smoke.py cleanup || true
          docker rm -f gimme-ci-minio >/dev/null 2>&1 || true
          sudo systemctl stop 'gimme-worker-*' 'gimme-horizon-*' \
            'gimme-scheduler-*.timer' 'gimme-scheduler-*.service' || true
          sudo systemctl stop caddy postgresql valkey-server ssh || true
