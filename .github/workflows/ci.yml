name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: uv sync --frozen
      - run: composer install --no-interaction --prefer-dist
      - run: uv run ruff check .
      - run: uv run ruff check --stdin-filename gimme-provision-stack - < scripts/gimme-provision-stack
      - run: uv run ruff check --stdin-filename gimme-provision-processes - < scripts/gimme-provision-processes
      - run: uv run bandit -q -r src
      - run: uv run bandit -q scripts/gimme-provision-stack scripts/gimme-provision-processes
      - run: uv export --frozen --no-dev --no-emit-project | uv run pip-audit -r /dev/stdin
      - run: uv run pytest -q
      - run: vendor/bin/phpstan analyse deploy.php --no-progress --level=5
      - run: php -l deploy.php
      - run: composer audit --locked --no-interaction
